# Push a tag like v0.1.0 (it must match the version in package.json). This builds the Windows installer and the
# portable exe, publishes them to a GitHub Release, and uploads latest.yml, which is what installed copies check to auto-update.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
